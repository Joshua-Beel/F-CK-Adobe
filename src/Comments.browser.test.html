<!doctype html><html><head><meta charset="UTF-8" /><title>Area highlight browser test</title><style>body{margin:24px;font-family:sans-serif}.paper{position:relative;width:408px;height:528px;background:#eee;box-shadow:0 1px 5px #0003}.page-image{position:absolute;inset:0;background:linear-gradient(#fff,#f9f9f9)}.native-highlight{position:absolute;box-sizing:border-box;left:81.6px;top:105.6px;width:122.4px;height:79.2px;background:#ffff0080;mix-blend-mode:multiply}.caption{margin:12px 0;color:#555}.controls{margin-top:12px}</style></head><body><p class="caption">Mocked native annotation data. The yellow rectangle represents the native-rendered area highlight; the component adds only transparent focus and edit targets.</p><div class="paper"><div id="page-image" class="page-image" aria-hidden="true"></div><span class="native-highlight" aria-hidden="true"></span><div id="root"></div></div><div class="controls"><button id="verify">Verify transparent target</button></div><script type="module">const[{default:CommentLayer},React,{createRoot}]=await Promise.all([import('./CommentLayer.tsx'),import('react'),import('react-dom/client')]);const annotation={id:'highlight-1',kind:'highlight',page:0,rect:{x:.2,y:.2,width:.3,height:.15},contents:null};function Demo(){const[placing,setPlacing]=React.useState(true);const[annotations,setAnnotations]=React.useState([annotation]);return React.createElement(CommentLayer,{page:0,pageWidth:612,pageHeight:792,annotations,creatingComment:false,creatingHighlight:placing,interactive:true,imageBounds:()=>document.getElementById('page-image').getBoundingClientRect(),onCommentCreate:()=>{},onHighlightCreate:(page,rect)=>{document.body.dataset.created=`${page}:${rect.x.toFixed(3)},${rect.y.toFixed(3)},${rect.width.toFixed(3)},${rect.height.toFixed(3)}`;setAnnotations([...annotations,{id:'created',kind:'highlight',page,rect,contents:null}]);setPlacing(false)},onSelect:value=>document.body.dataset.selected=value.id})}createRoot(document.getElementById('root')).render(React.createElement(Demo));document.getElementById('verify').onclick=()=>{const target=document.querySelector('[aria-label="Edit area highlight on page 1"]');document.body.dataset.transparent=target&&getComputedStyle(target).backgroundColor==='rgba(0, 0, 0, 0)'?'yes':'no'};</script></body></html>
